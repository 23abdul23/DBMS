services:
  db:
    image: postgres:16-alpine
    container_name: aegis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_MODE: sql
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/aegis?schema=public
      PORT: 3000
      FRONTEND_URL: http://localhost:8081
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aegis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_HOST: localhost
      API_PORT: 3000
    ports:
      - "8081:8081"

volumes:
  postgres_data:
