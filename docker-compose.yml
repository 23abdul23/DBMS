services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_MODE: sql
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aegis?schema=public
      PORT: 3000
      FRONTEND_URL: http://localhost:8081
    ports:
      - '5000:80'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aegis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_HOST: localhost
      API_PORT: 3000
    ports:
      - '8081:8081'

volumes:
  postgres_data:
